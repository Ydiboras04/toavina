{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
  <h1>Connexion</h1>

  {% if form.errors %}
    <p role="alert">Identifiant ou mot de passe incorrect.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Se connecter</button>
  </form>
{% endblock %}
